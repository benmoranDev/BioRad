[package]
name = "biorad-backend-rust"
version = "1.0.0"
edition = "2021"
authors = ["Ben Moran <benmoran29dev@gmail.com>"]
description = "Microserviço Backend em Rust (Axum + Tokio) integrado ao Supabase / PostgreSQL para o Instituto Biorad Cursos"

[dependencies]
# Framework Web Assíncrono de Alta Performance
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tokio = { version = "1.37", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "compression-full"] }

# Serialização & JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cliente HTTP Assíncrono para comunicação com o Supabase REST & Auth API
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Criptografia & JWT
jsonwebtoken = "9.3"
bcrypt = "0.15"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Variáveis de Ambiente & Logs
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"

# Driver SQL PostgreSQL Assíncrono com Connection Pooling (Supabase Direct Connection)
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "macros"] }
