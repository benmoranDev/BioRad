# ==============================================================================
# Fly.io Configuration for Biorad Rust Backend (Axum + Tokio + SQLx)
# Deployment Guide: fly deploy
# Region: gru (São Paulo, Brasil - Menor latência para alunos no Brasil)
# ==============================================================================

app = "biorad-backend-rust"
primary_region = "gru"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "backend-rust/Dockerfile"

[env]
  PORT = "8080"
  RUST_LOG = "info,tower_http=info,biorad_backend_rust=debug"
  RUST_BACKTRACE = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
